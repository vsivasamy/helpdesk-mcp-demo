name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write      # lets GITHUB_TOKEN push to ghcr.io/<owner>/<repo>

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/helpdesk-mcp-demo

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint Python (compile only)
        run: python -m compileall -q app db

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags (latest + short sha); metadata-action lower-cases the owner
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: roll the new image out to Azure Container Apps. Off unless the repo variable
  # DEPLOY_TO_ACA is "true" AND the OIDC secrets exist (see docs/DEPLOY.md, "Optional: CI deploy").
  deploy:
    needs: build
    if: ${{ vars.DEPLOY_TO_ACA == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC federation, no stored Azure password
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update container app to this commit's image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          az containerapp update -g rg-mcp-demo -n helpdesk-mcp \
            --image ghcr.io/$OWNER/helpdesk-mcp-demo:sha-$SHA
