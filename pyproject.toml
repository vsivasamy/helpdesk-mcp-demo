[project]
name = "helpdesk-mcp-demo"
version = "0.1.0"
description = "Demo IT helpdesk MCP server (Streamable HTTP, bearer auth, Postgres, fake data)"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "psycopg[binary]==3.3.9",
  "psycopg-pool==3.3.3",
  "uvicorn==0.54.0",
  "Faker==40.54.0",
]

[project.scripts]
helpdesk-mcp = "app.server:main"

[tool.setuptools]
packages = ["app"]
